# Graphite and mint, pinned so the app renders the same everywhere. Matches gradmit/style.py.
[theme]
base = "dark"
primaryColor = "#5EC4B0"
backgroundColor = "#0C1316"
secondaryBackgroundColor = "#141E22"
textColor = "#EEF3F4"
linkColor = "#5EC4B0"
borderColor = "rgba(186,214,220,0.18)"
codeBackgroundColor = "#141E22"

blueColor = "#6FA8DC"
greenColor = "#5EC4B0"
orangeColor = "#E2B45A"
redColor = "#E07A5F"
grayColor = "#8B9BA3"
violetColor = "#A99BE0"

dataframeBorderColor = "rgba(186,214,220,0.15)"
dataframeHeaderBackgroundColor = "#1A262B"
dataframeHeaderTextColor = "#EEF3F4"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap, sans-serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontSizes = ["2.5rem", "1.55rem", "1.25rem", "1.05rem", "1rem", "0.9rem"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
metricValueFontSize = "1.8rem"
metricValueFontWeight = 700

baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
paddingTop = "1rem"
paddingBottom = "2rem"

chartCategoricalColors = ["#5EC4B0", "#E2B45A", "#8B9BA3", "#E07A5F", "#6FA8DC"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
